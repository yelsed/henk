# Generated by cargo-dist / adjusted for henk (macOS-only).
# Triggers on any `v*` tag. Builds darwin-aarch64 + darwin-x86_64,
# packages each as a .tar.gz, uploads to GitHub Releases, and adds
# a shell installer script.
#
# To cut a release:
#   git tag v0.1.0 && git push origin v0.1.0

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: short
  RUSTUP_MAX_RETRIES: 10

jobs:
  # --------------------------------------------------------------------------
  # Build one binary per target triple.
  # --------------------------------------------------------------------------
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest      # cross-compile from arm64; all deps pure Rust

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          BIN=henk
          TAG=${{ github.ref_name }}
          TARGET=${{ matrix.target }}
          ARCHIVE="${BIN}-${TAG}-${TARGET}.tar.gz"
          cd "target/${TARGET}/release"
          tar czf "../../../${ARCHIVE}" "${BIN}"
          cd ../../..
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: henk-${{ matrix.target }}
          path: henk-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # Assemble the GitHub Release from all build artifacts.
  # --------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist/

      - name: Generate checksums
        run: |
          cd dist
          sha256sum henk-*.tar.gz > henk-${{ github.ref_name }}-checksums.txt

      - name: Build installer script
        run: |
          TAG=${{ github.ref_name }}
          cat > dist/henk-installer.sh << 'INSTALLER'
          #!/bin/sh
          # henk installer — downloads the correct binary for this Mac, puts it in
          # ~/.local/bin, and writes the receipt `henk update` reads. Run with:
          #   curl -fsSL https://github.com/yelsed/henk/releases/latest/download/henk-installer.sh | sh
          #
          # `henk update` re-runs this exact script to self-update, so it honours
          # the install dir axoupdater forces (CARGO_DIST_FORCE_INSTALL_DIR /
          # HENK_INSTALL_DIR) and installs the version it was built for rather than
          # re-resolving "latest".
          set -eu

          BIN_NAME="henk"
          REPO="yelsed/henk"
          VERSION="__TAG__"

          # Install dir: whatever `henk update` forces, else the default. Both env
          # vars point at the same place; HENK_INSTALL_DIR is the app-specific one.
          INSTALL_DIR="${HENK_INSTALL_DIR:-${CARGO_DIST_FORCE_INSTALL_DIR:-${HOME}/.local/bin}}"

          ARCH=$(uname -m)
          case "${ARCH}" in
            arm64)  TARGET="aarch64-apple-darwin" ;;
            x86_64) TARGET="x86_64-apple-darwin" ;;
            *)
              echo "Unsupported architecture: ${ARCH}" >&2
              echo "henk only supports macOS (Apple Silicon + Intel)." >&2
              exit 1
              ;;
          esac

          OS=$(uname -s)
          if [ "${OS}" != "Darwin" ]; then
            echo "henk is macOS-only. Detected OS: ${OS}" >&2
            exit 1
          fi

          URL="https://github.com/${REPO}/releases/download/${VERSION}/${BIN_NAME}-${VERSION}-${TARGET}.tar.gz"

          echo ""
          echo "Installing ${BIN_NAME} ${VERSION} (${TARGET})..."
          echo "  from: ${URL}"
          echo "  to:   ${INSTALL_DIR}/${BIN_NAME}"
          echo ""

          mkdir -p "${INSTALL_DIR}"
          curl -fsSL "${URL}" | tar xz -C "${INSTALL_DIR}"
          chmod +x "${INSTALL_DIR}/${BIN_NAME}"

          # The receipt axoupdater reads on `henk update`. Without it, henk can't
          # tell where it was installed from and refuses to self-update. Schema is
          # cargo-dist's; install_prefix is the bin dir itself, and the pinned
          # provider version keeps axoupdater from stripping a `bin` suffix that
          # isn't there. The recorded version carries no leading `v`.
          RECEIPT_DIR="${XDG_CONFIG_HOME:-${HOME}/.config}/henk"
          mkdir -p "${RECEIPT_DIR}"
          cat > "${RECEIPT_DIR}/henk-receipt.json" << RECEIPT
          {"binaries":["henk"],"install_prefix":"${INSTALL_DIR}","provider":{"source":"cargo-dist","version":"0.31.0"},"source":{"app_name":"henk","name":"henk","owner":"yelsed","release_type":"github"},"version":"${VERSION#v}"}
          RECEIPT

          echo "Done. ${BIN_NAME} installed to ${INSTALL_DIR}/${BIN_NAME}"

          if [ -z "${HENK_NO_MODIFY_PATH:-}" ]; then
            case ":${PATH}:" in
              *":${INSTALL_DIR}:"*) ;;
              *)
                echo ""
                echo "Add ${INSTALL_DIR} to your PATH:"
                echo "  export PATH=\"${INSTALL_DIR}:\$PATH\""
                echo ""
                echo "Then verify: henk --version"
                ;;
            esac
          fi
          INSTALLER
          sed -i "s|__TAG__|${TAG}|" dist/henk-installer.sh
          chmod +x dist/henk-installer.sh

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/henk-*.tar.gz
            dist/henk-*-checksums.txt
            dist/henk-installer.sh
          generate_release_notes: true
          fail_on_unmatched_files: true
